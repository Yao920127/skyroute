# 反向代理：靜態資產 + /api 轉發 + 請求限流 + 安全標頭
# 這是 nginx 映像的範本：${PORT}、${API_UPSTREAM}、${REAL_IP_FROM} 於容器啟動時由環境變數展開
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=search:10m rate=2r/s;


server {
    # 後端重新部署後內部 IP 會改變：不能用 upstream 區塊（只在啟動時解析一次），
    # 改用變數搭配 resolver，每 10 秒重新查詢 DNS。NGINX_LOCAL_RESOLVERS 由映像從 /etc/resolv.conf 產生
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    resolver_timeout 5s;
    set $api_backend http://${API_UPSTREAM};

    listen ${PORT};
    listen [::]:${PORT};
    server_name _;

    # 前面有平台的邊緣代理時，限流要依真正的用戶端 IP（邊緣代理寫入的 X-Real-IP），而不是代理的 IP
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header X-Real-IP;
    root /usr/share/nginx/html;
    server_tokens off;

    # 注意：location 內只要有 add_header 就不會繼承這裡，因此各 location 皆 include 同一份
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 會打到外部 API 的昂貴端點：較嚴格的限流
    location ~ ^/api/(search|fare-matrix|patrol/run)$ {
        limit_req zone=search burst=6 nodelay;
        limit_req_status 429;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # 讓 NDJSON 矩陣能逐格串流
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri.html /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
