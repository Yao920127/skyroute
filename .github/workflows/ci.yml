name: CI

on:
  pull_request:
  push:
    branches: [main]

# main：每個提交各自一組、互不取消。Railway 要等該提交的 CI 通過才部署，
# 被取消的提交會被跳過，連續推送時前端改版就可能一直沒部署。
# PR：同一分支的新推送取消舊的檢查，節省執行時間。
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend · lint / type / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skyroute
          POSTGRES_PASSWORD: skyroute
          POSTGRES_DB: skyroute_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skyroute" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://skyroute:skyroute@localhost:5432/skyroute_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend · check / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: vp run build

  images:
    name: Build OCI images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR 的映像名稱必須全小寫，但 github.repository 是 Yao920127/skyroute
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }},${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }},${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
